<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Contact</h1>
    <nav>
      <a href="index.html">Acasă</a>
      <a href="destinatii.html">Destinații</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="intro">
      <h2>Scrie-ne un mesaj</h2>

      <form>
        <label for="nume">Numele tău:</label><br>
        <input type="text" id="nume" name="nume" required><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="mesaj">Mesaj:</label><br>
        <textarea id="mesaj" name="mesaj" rows="5" required></textarea><br><br>

        <button class="buton" type="submit">Trimite</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Proiect realizat cu HTML și CSS</p>
  </footer>
</body>
</html>
